<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Grid Example</title>
    <style>

        body{
            font-family:Arial;
            background-color: #f4f6f9;
        }
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 100px 100px;
            grid-template-areas: 
                  "cse ece it"
                  " ai cyber data";
                  grid-auto-columns: 150px;
                  grid-auto-rows: 100px;
                  grid-auto-flow: row;

                  justify-items: stretch;
                  align-items: stretch;
                  place-items: stretch;

                  justify-content: center;
                  align-content: center;
                  place-content: center;

                  gap: 20px;
                  row-gap: 20px;
                  column-gap: 20px;

                  background-color: #263445;
                  padding: 20px;
                  min-height: 300px;
        }
        .box{
            color: white;
            padding: 30px;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;

            display: grid;
            place-items: center;
        }
        .box:nth-child(1){
            background-color: #2563eb;
            grid-area: cse;
        }
        .box:nth-child(2){
            background-color: #059669;
            grid-area: ece;
            grid-column: 2;
            grid-row: 1;
        }
        .box:nth-child(3){
            background-color: #d97706;
            grid-area: it;
        }
        .box:nth-child(4){
            background-color: #7c3aed;
             grid-area: ai;
        }
        .box:nth-child(5){
            background-color: #db2777;
            grid-area: cyber;
            justify-self: center;
            align-self: center;
            place-self: center;
        }
        .box:nth-child(6){
            background-color: #0891b2;
            grid-area: data;
        }
    </style>
</head>
<body>
    <h2>Course Dash board</h2>
    <div class="container">
        <div class="box">CSE</div>
        <div class="box">ECE</div>
        <div class="box">IT</div>
        <div class="box">AI</div>
        <div class="box">Cyber Security</div>
        <div class="box">Data Science</div>
    </div>
    
</body>
</html>
